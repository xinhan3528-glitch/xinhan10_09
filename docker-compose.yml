
services:
  db:
    container_name: postDB
    image: postgres:16.11-alpine3.23
    volumes:
      - "./database/postgres-data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    restart: unless-stopped
